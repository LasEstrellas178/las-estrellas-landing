<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAS ESTRELLAS — Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}h1{color:#d4af37;letter-spacing:3px}.lead{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#191919;border:1px solid #333;border-radius:16px;padding:21px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;color:#ddd}input,textarea,select{width:100%;padding:11px;border:1px solid #444;border-radius:9px;background:#0d0d0d;color:#fff;font:inherit}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px;align-items:end}.num{border:1px solid #333;padding:12px;border-radius:12px;margin-top:10px}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.save{background:#d4af37;color:#111}.add{background:#333;color:#fff}.danger{background:#522626;color:#fff}.logout{float:right;background:#333;color:#fff}.status{margin-left:10px;color:#d4af37;font-weight:700}.preview{display:inline-block;margin-top:12px;color:#d4af37}.login{max-width:400px;margin:12vh auto;background:#191919;border:1px solid #333;border-radius:18px;padding:28px}.login h1{text-align:center}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><h1>✦ LAS ESTRELLAS</h1><p>Panel privado</p><label>Usuario</label><input id="username" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button class="save" style="width:100%;margin-top:18px" onclick="doLogin()">INGRESAR</button><p id="loginError" style="color:#e57373"></p></div>
<div id="app" class="wrap hidden"><button class="logout" onclick="logout()">Cerrar sesión</button><h1>✦ LAS ESTRELLAS</h1><p class="lead">Panel de administración — editá tu landing sin tocar el código.</p><div class="grid">
<section class="panel"><h2>Contenido</h2><label>Título</label><input id="title"><label>Subtítulo</label><textarea id="subtitle"></textarea><label>Texto predeterminado</label><input id="buttonText"><label>Mensaje de WhatsApp</label><textarea id="message"></textarea><label>URL del logo (opcional)</label><input id="logoUrl" placeholder="https://..."></section>
<section class="panel"><h2>Diseño</h2><label>Fondo</label><input id="background" type="color"><label>Tarjeta</label><input id="cardColor" type="color"><label>Botones / Dorado</label><input id="primaryColor" type="color"><label>Texto principal</label><input id="textColor" type="color"><label>Texto secundario</label><input id="secondaryTextColor" type="color"><label>Tipografía</label><select id="font"><option>Arial, sans-serif</option><option>Georgia, serif</option><option>Verdana, sans-serif</option><option>Trebuchet MS, sans-serif</option><option>Courier New, monospace</option></select></section>
<section class="panel full"><h2>WhatsApp</h2><label><input id="rotation" type="checkbox" style="width:auto"> Rotar números en cada clic</label><div id="numbers"></div><button class="add" onclick="addNumber()">+ Agregar número</button></section>
<section class="panel full"><button class="save" onclick="save()">GUARDAR CAMBIOS</button><span id="status" class="status"></span><br><a class="preview" href="/" target="_blank">Ver LAS ESTRELLAS ↗</a></section></div></div>
<script>
let cfg,$=id=>document.getElementById(id);
async function boot(){let r=await fetch("/api/admin-config");if(r.ok){showApp(await r.json())}}
function showApp(c){cfg=c;login.classList.add("hidden");app.classList.remove("hidden");["title","subtitle","buttonText","message","logoUrl","background","cardColor","primaryColor","textColor","secondaryTextColor","font"].forEach(k=>$(k).value=cfg[k]);rotation.checked=cfg.rotation;renderNumbers()}
async function doLogin(){loginError.textContent="";let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});if(!r.ok){loginError.textContent="Usuario o contraseña incorrectos.";return}password.value="";boot()}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
function renderNumbers(){numbers.innerHTML="";cfg.numbers.forEach((n,i)=>{let d=document.createElement("div");d.className="num";d.innerHTML=`<div class="row"><div><label>Nombre</label><input value="${esc(n.label)}" data-k="label"></div><div><label>Número</label><input value="${esc(n.number)}" data-k="number" placeholder="+549..."></div><div><label>Activo</label><input type="checkbox" data-k="enabled" ${n.enabled?"checked":""} style="width:auto"><button class="danger" onclick="removeNumber(${i})">Eliminar</button></div></div>`;d.querySelectorAll("input").forEach(x=>x.oninput=()=>cfg.numbers[i][x.dataset.k]=x.type==="checkbox"?x.checked:x.value);numbers.appendChild(d)})}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}function addNumber(){cfg.numbers.push({label:`WhatsApp ${cfg.numbers.length+1}`,number:"",enabled:true});renderNumbers()}function removeNumber(i){cfg.numbers.splice(i,1);renderNumbers()}
async function save(){["title","subtitle","buttonText","message","logoUrl","background","cardColor","primaryColor","textColor","secondaryTextColor","font"].forEach(k=>cfg[k]=$(k).value);cfg.rotation=rotation.checked;let r=await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cfg)});status.textContent=r.ok?"Guardado ✓":"Error";setTimeout(()=>status.textContent="",2500)}
boot()
</script></body></html>
