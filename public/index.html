<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="LAS ESTRELLAS"><meta name="theme-color" content="#080808"><title>LAS ESTRELLAS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap');
*{box-sizing:border-box}html{min-height:100%;background:#080808}body{margin:0;min-height:100vh;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px;overflow:auto;transition:background .2s,color .2s}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#3b301455 0,transparent 38%),radial-gradient(circle at 15% 85%,#d4af3712 0,transparent 25%);pointer-events:none}
.stars{position:fixed;inset:0;opacity:.5;background-image:radial-gradient(#d4af37 1px,transparent 1px);background-size:95px 95px;mask-image:linear-gradient(to bottom,transparent,#000,transparent);pointer-events:none}
.card{position:relative;width:min(440px,100%);padding:34px 25px 28px;border:1px solid #d4af3748;border-radius:22px;background:linear-gradient(145deg,#191919,#0d0d0d);box-shadow:0 25px 80px #000,0 0 45px #d4af3712;text-align:center}
.crown{font-size:27px;color:#d4af37;margin-bottom:7px;text-shadow:0 0 18px #d4af3766}.logo{max-width:170px;max-height:95px;margin:0 auto 13px;display:none;object-fit:contain}h1{font-family:Cinzel,Georgia,serif;letter-spacing:5px;margin:0;color:#d4af37;font-size:31px;text-shadow:0 2px 16px #d4af3744}.line{width:85px;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:14px auto 17px}.subtitle{color:#b8b8b8;margin:0 auto 25px;line-height:1.5;font-size:15px}.buttons{display:grid;gap:12px}.wa{position:relative;display:block;padding:16px;border:1px solid #d4af37;border-radius:12px;background:linear-gradient(135deg,#242424,#101010);color:#f5f5f5;text-decoration:none;font-weight:700;letter-spacing:1px;box-shadow:inset 0 1px #fff1,0 7px 22px #0008;transition:transform .18s,box-shadow .18s,opacity .18s;cursor:pointer}.wa:before{content:"✦";color:#d4af37;margin-right:10px}.wa:hover{transform:translateY(-2px);box-shadow:0 10px 30px #000,0 0 18px #d4af3725}.wa:active{transform:translateY(0)}.wa.disabled{opacity:.5;pointer-events:none}.note{margin-top:20px;color:#777;font-size:11px;letter-spacing:.3px}
@media(max-width:420px){body{padding:12px}.card{padding:28px 18px 23px}h1{font-size:27px;letter-spacing:4px}}
</style></head><body><div class="stars"></div><main class="card"><div class="crown">✦</div><img id="logo" class="logo" alt="LAS ESTRELLAS"><h1 id="title">LAS ESTRELLAS</h1><div class="line"></div><p id="subtitle" class="subtitle"></p><div id="buttons" class="buttons"><a id="waButton" class="wa" href="#" aria-label="Abrir WhatsApp">WhatsApp</a></div><div id="note" class="note">Al seleccionar una opción se abrirá WhatsApp.</div></main>
<script>
let config={};let rotationIndex=0;let pixelReady=false;
const $=id=>document.getElementById(id);const digits=n=>String(n||"").replace(/[^\d]/g,"");
function activeNumbers(){return (config.numbers||[]).filter(n=>n&&n.enabled&&digits(n.number));}
function loadPixel(){
  const id=digits(config.pixelId); if(!id||pixelReady)return;
  window.fbq=window.fbq||function(){window.fbq.callMethod?window.fbq.callMethod.apply(window.fbq,arguments):window.fbq.queue.push(arguments)};
  if(!window._fbq)window._fbq=window.fbq;window.fbq.push=window.fbq;window.fbq.loaded=true;window.fbq.version='2.0';window.fbq.queue=[];
  const script=document.createElement('script');script.async=true;script.src='https://connect.facebook.net/en_US/fbevents.js';document.head.appendChild(script);
  window.fbq('init',id);window.fbq('track','PageView');pixelReady=true;
}
function render(){
  document.documentElement.style.background=config.background||'#080808';document.body.style.background=config.background||'#080808';document.body.style.color=config.textColor||'#f5f5f5';document.body.style.fontFamily=config.font||'Arial,sans-serif';
  $('title').textContent=config.title||'LAS ESTRELLAS';$('title').style.color=config.primaryColor||'#d4af37';$('subtitle').textContent=config.subtitle||'';$('subtitle').style.color=config.secondaryTextColor||'#b8b8b8';
  const card=document.querySelector('.card');card.style.background=config.cardColor||'#151515';card.style.borderColor=(config.primaryColor||'#d4af37')+'66';
  const line=document.querySelector('.line');line.style.background='linear-gradient(90deg,transparent,'+(config.primaryColor||'#d4af37')+',transparent)';document.querySelector('.crown').style.color=config.primaryColor||'#d4af37';
  const logo=$('logo');logo.src=config.logoUrl||'';logo.style.display=config.logoUrl?'block':'none';
  const button=$('waButton');button.textContent=config.buttonText||'WhatsApp';button.style.borderColor=config.primaryColor||'#d4af37';button.style.color=config.textColor||'#f5f5f5';
  const active=activeNumbers();button.classList.toggle('disabled',!active.length);button.setAttribute('aria-disabled',String(!active.length));
  $('note').textContent=active.length?'Al seleccionar el botón se abrirá WhatsApp.':'WhatsApp no está disponible en este momento.';
  loadPixel();
}
$('waButton').addEventListener('click',e=>{
  e.preventDefault();const active=activeNumbers();if(!active.length)return;
  const target=config.rotation?active[rotationIndex++%active.length]:active[0];const number=digits(target.number);const message=encodeURIComponent(config.message||'Hola, quiero más información.');
  if(window.fbq){window.fbq('track','Contact',{content_name:'WhatsApp',phone_slot:target.label||'WhatsApp'});}
  window.location.href='https://wa.me/'+number+'?text='+message;
});
fetch('/api/config',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('config');return r.json()}).then(c=>{config=c;render()}).catch(()=>{$('subtitle').textContent='No se pudo cargar la configuración.';$('waButton').classList.add('disabled')});
</script></body></html>
